<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pace</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <h1 class="wordmark">Pace</h1>

    <!-- The one control that matters most: big, labelled, iOS-style. The whole row toggles it. -->
    <label class="power" for="enabled">
      <span class="power-text">
        <span id="power-title" class="power-title">Reading focus</span>
        <span id="power-status" class="power-status">Off</span>
      </span>
      <input id="enabled" type="checkbox" role="switch" aria-labelledby="power-title" aria-describedby="power-status">
      <span class="track" aria-hidden="true"><span class="thumb"></span></span>
    </label>

    <!-- Miniature page showing the current overlay; hover to move the band. -->
    <div id="preview" class="preview" aria-hidden="true">
      <div class="page">
        <span class="line heading w55"></span>
        <span class="line w90"></span><span class="line w80"></span><span class="line w85"></span>
        <div class="figure-row"><span class="figure"></span><span class="figure-lines"><span class="line w90"></span><span class="line w75"></span><span class="line w85"></span></span></div>
        <span class="line w90"></span><span class="line w70"></span><span class="line w80"></span>
      </div>
      <div class="dim dim-top"></div>
      <div class="dim dim-bottom"></div>
    </div>

    <div id="notice" class="notice" role="status" hidden>
      <span id="notice-text"></span>
      <button id="notice-action" type="button" class="notice-action" hidden></button>
    </div>

    <div class="controls">
      <div class="row">
        <h2 id="size-label">Size</h2>
        <div class="segmented" role="group" aria-labelledby="size-label" data-setting="size">
          <button type="button" data-value="S" aria-pressed="false" aria-label="Small">S</button>
          <button type="button" data-value="M" aria-pressed="false" aria-label="Medium">M</button>
          <button type="button" data-value="L" aria-pressed="false" aria-label="Large">L</button>
        </div>
      </div>

      <div class="row">
        <h2 id="color-label">Color</h2>
        <div class="segmented" role="group" aria-labelledby="color-label" data-setting="isDarkMode">
          <button type="button" data-value="true" aria-pressed="false">Dark</button>
          <button type="button" data-value="false" aria-pressed="false">Light</button>
        </div>
      </div>

      <div class="row slider-row">
        <label for="opacity">Opacity</label>
        <input id="opacity" type="range" min="10" max="100" step="1" value="70">
        <output id="opacity-value" for="opacity">70%</output>
      </div>

      <div class="row slider-row">
        <label for="blur">Blur</label>
        <input id="blur" type="range" min="0" max="20" step="1" value="0">
        <output id="blur-value" for="blur">0px</output>
      </div>
    </div>
  </main>
  <script src="../core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
